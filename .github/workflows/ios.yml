name: Build for iOS

on:
  # 重建线：推到 rebuild/* 分支就自动打包，方便每一轮改动直接出未签名 IPA。
  push:
    branches:
      - "rebuild/**"
  workflow_call:
    inputs:
      tag:
        description: "tag"
        required: false
        default: ""
        type: string
  workflow_dispatch:

jobs:
  build-macos-app:
    name: Release IOS
    runs-on: macos-26
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      - name: Set and Extract version
        shell: pwsh
        run: lib/scripts/build.ps1

      - name: Apply Patch
        shell: pwsh
        run: lib/scripts/patch.ps1 iOS

      - name: Analyze Dart
        run: |
          set +e
          # controller.dart 必须一起分析：抖音播放页复用了它，改它的签名
          # （setDataSource 的 isLocalFile）如果只靠 CI 的 Xcode 阶段发现，
          # 报出来的往往是误导性的签名错误。analyze 几秒就能定位。
          flutter analyze --no-fatal-infos --no-fatal-warnings lib/pages/douyin lib/models/common/nav_bar_config.dart lib/pages/main/controller.dart lib/main.dart lib/plugin/pl_player/controller.dart
          EXIT=$?
          if [ $EXIT -ne 0 ]; then
            echo "=== analyzer found errors; full output above ==="
            exit 1
          fi

      - name: Build iOS
        run: |
          set +e
          # PILIPLUS_QA 暂时不打开：qa_probe.dart 还在修编译错误，
          # 打开会让整个包编不过，连带播放页的修复都装不上。
          flutter build ios --release --no-codesign --dart-define-from-file=pili_release.json --no-pub -v > /tmp/build.log 2>&1
          BUILD_EXIT=$?
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "=== build failed, showing xcode errors ==="
            grep -n -i -E "error:|failed|Signing|CodeSign|Dart Error|\.dart:[0-9]+" /tmp/build.log | tail -n 120
            echo "=== tail ==="
            tail -n 80 /tmp/build.log
            exit $BUILD_EXIT
          fi
          ln -sf ./build/ios/iphoneos Payload
          # make AltSign happy...
          find Payload/Runner.app/Frameworks -type d -name "*.framework" -exec codesign --force --sign - --preserve-metadata=identifier,entitlements {} \;
          zip -r9 PiliPlus_ios_${{env.version}}.ipa Payload/Runner.app

      - name: Release
        if: ${{ github.event.inputs.tag != '' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: ${{ github.event.inputs.tag }}
          files: |
            PiliPlus_ios_*.ipa

      - name: Upload ios release
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: iOS-release
          path: PiliPlus_ios_*.ipa
