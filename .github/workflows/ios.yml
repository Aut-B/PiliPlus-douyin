name: Build for iOS

on:
  # 重建线：推到 rebuild/* 分支就自动打包，方便每一轮改动直接出未签名 IPA。
  push:
    branches:
      - "rebuild/**"
  workflow_call:
    inputs:
      tag:
        description: "tag"
        required: false
        default: ""
        type: string
  workflow_dispatch:

jobs:
  build-macos-app:
    name: Release IOS
    runs-on: macos-26
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      - name: Set and Extract version
        shell: pwsh
        run: lib/scripts/build.ps1

      - name: Apply Patch
        shell: pwsh
        run: lib/scripts/patch.ps1 iOS

      - name: Analyze Dart
        run: |
          set +e
          # controller.dart 必须一起分析：抖音播放页复用了它，改它的签名
          # （setDataSource 的 isLocalFile）如果只靠 CI 的 Xcode 阶段发现，
          # 报出来的往往是误导性的签名错误。analyze 几秒就能定位。
          flutter analyze --no-fatal-infos --no-fatal-warnings lib/pages/douyin lib/models/common/nav_bar_config.dart lib/pages/main/controller.dart lib/main.dart lib/plugin/pl_player/controller.dart
          EXIT=$?
          if [ $EXIT -ne 0 ]; then
            echo "=== analyzer found errors; full output above ==="
            exit 1
          fi

      - name: Build iOS
        run: |
          set +e
          # PILIPLUS_QA 暂时不打开：qa_probe.dart 还在修编译错误，
          # 打开会让整个包编不过，连带播放页的修复都装不上。
          flutter build ios --release --no-codesign --dart-define-from-file=pili_release.json --no-pub -v > /tmp/build.log 2>&1
          BUILD_EXIT=$?
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "=== build failed, showing xcode errors ==="
            grep -n -i -E "error:|failed|Signing|CodeSign|Dart Error|\.dart:[0-9]+" /tmp/build.log | tail -n 120
            echo "=== tail ==="
            tail -n 80 /tmp/build.log
            exit $BUILD_EXIT
          fi
          ln -sf ./build/ios/iphoneos Payload
          # make AltSign happy...
          find Payload/Runner.app/Frameworks -type d -name "*.framework" -exec codesign --force --sign - --preserve-metadata=identifier,entitlements {} \;
          # 在打包之前就把可执行位补好：zip 只记录源文件当时的权限，
          # Flutter 产出的 App.framework/App 常常是 0644，TrollStore 装上会闪退。
          # 放在这里做，下面只需打一次包，不用打完再删再重打。
          chmod 755 Payload/Runner.app/Runner
          chmod 755 Payload/Runner.app/Frameworks/App.framework/App
          chmod 755 Payload/Runner.app/Frameworks/Flutter.framework/Flutter
          for framework in Payload/Runner.app/Frameworks/*.framework; do
            binary="$framework/$(basename "$framework" .framework)"
            if [ -f "$binary" ]; then
              chmod 755 "$binary"
            fi
          done
          zip -r9 PiliPlus_ios_${{env.version}}.ipa Payload/Runner.app

      - name: Verify executable bits inside IPA
        run: |
          set -euo pipefail
          # 只做校验，不重新打包：chmod 已经在 Build 步骤里完成。
          # 这里读 IPA 里真实的 unix 权限，确认 755 真的写进去了。
          python3 - "PiliPlus_ios_${{env.version}}.ipa" <<'PY'
          import sys
          import zipfile

          required = (
              "Payload/Runner.app/Runner",
              "Payload/Runner.app/Frameworks/App.framework/App",
              "Payload/Runner.app/Frameworks/Flutter.framework/Flutter",
          )
          with zipfile.ZipFile(sys.argv[1]) as z:
              modes = {name: oct(z.getinfo(name).external_attr >> 16) for name in required}
              bad = [
                  (name, mode)
                  for name, mode in modes.items()
                  if ((z.getinfo(name).external_attr >> 16) & 0o777) != 0o755
              ]
          for name, mode in modes.items():
              print("mode %s %s" % (mode, name))
          if bad:
              sys.exit("IPA modes are not 755: %r" % bad)
          print("IPA modes verified: 755")
          PY

      - name: Release
        if: ${{ github.event.inputs.tag != '' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: ${{ github.event.inputs.tag }}
          files: |
            PiliPlus_ios_*.ipa

      - name: Upload ios release
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: iOS-release
          path: PiliPlus_ios_*.ipa
